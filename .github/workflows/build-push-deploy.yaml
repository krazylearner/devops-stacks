name: build-push-deploy
on:
  push:
    branches: [main]
    paths: ["stacks/my-app/**", ".github/workflows/build-push-deploy.yaml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/krazylearner/devops-stacks/my-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile stacks/my-app/app.py

  build-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: stacks/my-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_MYAPP }}" ]; then
            echo "skip: set PORTAINER_WEBHOOK_MYAPP secret in GH repo settings"
            exit 0
          fi
          curl -sS -X POST "${{ secrets.PORTAINER_WEBHOOK_MYAPP }}" -o /dev/null -w "webhook http=%{http_code}\n"
