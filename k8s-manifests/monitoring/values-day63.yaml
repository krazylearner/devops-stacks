# values override — day63-66 homelab-sized sizing
grafana:
  adminUser: admin
  persistence:
    enabled: false
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  service:
    type: NodePort
    nodePort: 31300
# keep footprint small: noThanos, minimal retention
prometheus:
  prometheusSpec:
    retention: 4h
    retentionSize: 1GB
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
        cpu: 25m
      limits:
        memory: 128Mi
        cpu: 250m
kubeStateMetrics:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 100m
# operator-tier extras we skip on homelab
defaultRules:
  create: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
