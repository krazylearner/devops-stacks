services:
  app:
    image: ghcr.io/krazylearner/devops-stacks/my-app:${TAG:-latest}
    container_name: ${CONTAINER_NAME:-my-app}
    ports:
      - ${HOST_PORT:-8088}:8000
    environment:
      APP_VERSION: ${APP_VERSION:-v1}
      GIT_SHA: ${GIT_SHA:-local}
      PORT: 8000
    restart: always
    mem_limit: 128m
    cpus: 0.3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
