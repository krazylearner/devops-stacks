services:
  kuma:
    image: louislam/uptime-kuma:1
    container_name: kuma
    restart: always
    ports:
      - 8090:3001
    volumes:
      - kuma_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: always
    ports:
      - 8091:8090
    volumes:
      - beszel_data:/beszel_data
    mem_limit: 256m
    cpus: 0.5

  agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: ${BESZEL_LISTEN:-45876}
      KEY: ${BESZEL_KEY}
    mem_limit: 128m
    cpus: 0.3

volumes:
  kuma_data:
  beszel_data:
